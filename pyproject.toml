# mliport repository tooling configuration.
#
# This is intentionally NOT a Python runtime project.  Each engine (UMA,
# MACE, DPA, GRACE) installs into its own isolated environment via
# `scripts/install_mliport.sh` (see mliport/install/compatibility.py).  The four
# stacks have mutually exclusive dependencies, so no single workspace lockfile
# is maintained here.
#
# The actual `mliport` package metadata lives in `mliport/pyproject.toml`.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
include = [
    "mliport/mliport/**/*.py",
    "tests/**/*.py",
    "scripts/*.py",
]

[tool.ruff.lint]
select = [
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "E",      # pycodestyle error
  "F",      # pyflakes
  "FA",     # flake8-future-annotations
  "I",      # isort
  "ICN",    # flake8-import-conventions
  "PERF",   # perflint
  "PIE",    # flake8-pie
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "Q",      # flake8-quotes
  "RET",    # flake8-return
  "RUF",    # Ruff-specific rules
  "SIM",    # flake8-simplify
  "TCH",    # flake8-type-checking
  "UP",     # pyupgrade
  "W",      # pycodestyle warning
]
ignore = [
  "E501",   # Line too long
  "PLR",    # Design related pylint codes
  "B028",   # No explicit stacklevel
  "RET505", # Unnecessary `elif` after `return`
  "PT011",  # pytest.raises
  "UP007",  # Use `X | Y` for type annotations
  "SIM108", # Use ternary operator
  # Test-style / historical preferences kept in the existing suite:
  "PLC0415", # Import outside toplevel (intentional lazy imports)
  "PT018",   # Assertion should be broken into multiple parts
  "PT006",   # pytest.raises positional arg
  "PT023",   # pytest.mark.decorator
  "TCH003",  # stdlib import in type-checking block
  "E741",    # Ambiguous variable name in existing tests
  "B007",    # Unused loop control variable
  "PERF102", # Use values() of dict
  "RUF001",  # Ambiguous unicode character
  "RUF100",  # Unused noqa directive
]

[tool.ruff.lint.isort]
known-first-party = ["mliport"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"mliport/mliport/install/__init__.py" = ["F401"]
# Test-only style rules stay scoped to tests instead of masking production.
"tests/**" = ["F841", "B017"]
