name: temporary NPT ruff format (remove after use)
on:
  push:
    branches:
      - feat/ase-isotropic-mtk-npt
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ase-isotropic-mtk-npt
          persist-credentials: true
      - uses: astral-sh/setup-uv@v7
      - name: Apply pinned formatter to NPT-touched Python files
        run: |
          uvx ruff@0.5.1 format \
            mliport/mliport/cli.py \
            mliport/mliport/config/schema.py \
            mliport/mliport/engine.py \
            mliport/mliport/runners/md.py \
            mliport/mliport/tui/config_screen.py \
            tests/mliport/mliport/test_md_npt.py
          if ! git diff --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -am "style(md): apply pinned ruff format to NPT files"
            git push origin HEAD:feat/ase-isotropic-mtk-npt
          fi
