name: package-build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.12"
          enable-cache: true
          # This repository deliberately has no uv.lock; the real
          # dependency manifest is mlipx/pyproject.toml, so the cache
          # key must hash that path (a uv.lock default never matched).
          cache-dependency-glob: "mlipx/pyproject.toml"
      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Build wheel and sdist
        run: uv build --wheel --sdist --out-dir mlipx/dist ./mlipx
      - name: Check distribution contents
        run: python scripts/check_repository_hygiene.py mlipx/dist/*
      - name: Install wheel into clean env and smoke test
        run: |
          uv venv .venv-smoke --python 3.12
          uv pip install --python .venv-smoke/bin/python ./mlipx/dist/*.whl
          .venv-smoke/bin/mlipx --help
          .venv-smoke/bin/mlipx setup --json
