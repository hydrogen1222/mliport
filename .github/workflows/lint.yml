name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # Pin the ruff version the project actually enforces locally; an
      # unpinned `uv run ruff` drifts with new releases and fails on renamed
      # rules (e.g. TCH003 -> TC003) that the 0.5.1 baseline never checks.
      - name: Ruff check
        run: uvx ruff@0.5.1 check mlipx/mlipx tests scripts
      - name: Ruff format check
        run: uvx ruff@0.5.1 format --check mlipx/mlipx tests scripts
