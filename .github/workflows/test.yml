name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          # This repository deliberately has no uv.lock; the real
          # dependency manifest is mliport/pyproject.toml, so the cache
          # key must hash that path (a uv.lock default never matched).
          cache-dependency-glob: "mliport/pyproject.toml"
      - name: Install mliport dev dependencies
        run: |
          uv venv .venv-dev --python ${{ matrix.python-version }}
          uv pip install --python .venv-dev/bin/python -e './mliport[dev]'
      # test_json_writer exercises the JSON encoder's torch-tensor path, so
      # the full suite needs torch. Use the CPU index; the PyPI linux wheel
      # drags in the multi-GB CUDA stack the suite never touches.
      - name: Install CPU torch for the test suite
        run: |
          uv pip install --python .venv-dev/bin/python torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: |
          .venv-dev/bin/python -m pytest tests -q

  analysis-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          # This repository deliberately has no uv.lock; the real
          # dependency manifest is mliport/pyproject.toml, so the cache
          # key must hash that path (a uv.lock default never matched).
          cache-dependency-glob: "mliport/pyproject.toml"
      - name: Install all analysis backends
        run: |
          uv venv .venv-analysis --python 3.12
          uv pip install --python .venv-analysis/bin/python -e './mliport[dev,analysis-all]'
      - name: Verify supported backend majors
        run: |
          .venv-analysis/bin/python -c "import gemdat, kinisi; assert gemdat.__version__.startswith('1.'); assert kinisi.__version__.startswith('2.')"
      - name: Run real kinisi and GEMDAT integration tests
        run: |
          .venv-analysis/bin/python -m pytest tests/mliport/mliport/analysis/test_analysis_backends_integration.py -q

  # The built wheel must install and import on every supported Python, not
  # just the runner that happens to build/test. Smoke only -- the heavy
  # analysis matrix stays on its own job.
  wheel-install-smoke:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          # This repository deliberately has no uv.lock; the real
          # dependency manifest is mliport/pyproject.toml, so the cache
          # key must hash that path (a uv.lock default never matched).
          cache-dependency-glob: "mliport/pyproject.toml"
      - name: Build wheel
        run: uv build --wheel --out-dir dist ./mliport
      - name: Install wheel into a clean pinned interpreter
        run: |
          uv venv wheel-clean --python ${{ matrix.python-version }}
          uv pip install --python wheel-clean/bin/python --no-deps dist/mliport-*.whl
      - name: Smoke test the installed wheel
        run: |
          wheel-clean/bin/python -I - <<'PY'
          import sys

          from mliport.capabilities import require_neb_capability, resolve_capabilities

          ok = resolve_capabilities({}, ["energy", "forces"])
          require_neb_capability(ok)
          direct = resolve_capabilities({"direct_forces": True}, ["energy", "forces"])
          try:
              require_neb_capability(direct)
          except ValueError:
              pass
          else:
              raise SystemExit("direct-force models must be rejected")
          print("capability wheel smoke ok on", sys.version)
          PY
