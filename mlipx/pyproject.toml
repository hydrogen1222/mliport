[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlipx"
version = "2.0.0"
description = "VASP-like CLI/TUI interface for MLIP models (UMA, MACE, DPA, GRACE)"
readme = "README.md"
license = { text = "MIT License" }
requires-python = ">=3.10, <3.13"
dependencies = [
    "ase>=3.26.0",
    "numpy",
    "packaging",
    "tqdm",
    "textual>=0.40.0",
]

[project.optional-dependencies]
# NOTE: there is deliberately no `uma` extra. UMA is installed by the
# compatibility-matrix-driven installer (scripts/install_mlipx.sh), which pins
# the fairchem-core version in mlipx/install/compatibility.py. A PyPI extra
# would drift from the matrix and conflicts with fairchem-core's own Python
# requirement.
analysis = [
    "scipy>=1.11",
    "matplotlib>=3.10.9",
]
transport = [
    "kinisi>=2.0.5,<3",
]
electrolyte = [
    "gemdat>=1.7.3,<2",
]
analysis-all = [
    "scipy>=1.11",
    "matplotlib>=3.10.9",
    "kinisi>=2.0.5,<3",
    "gemdat>=1.7.3,<2",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
mlipx = "mlipx.cli:main"

[project.urls]
repository = "https://github.com/hydrogen1222/mlipx"
documentation = "https://github.com/hydrogen1222/mlipx/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["."]
# Explicit include list: auto-discovery would pick up stale setuptools build
# caches (build/lib/**) and other repository artifacts as packages.
include = ["mlipx", "mlipx.*", "examples", "examples.*"]
namespaces = false


# Curated capability evidence must ship inside the wheel so an installed
# mlipx can resolve capabilities without a repository checkout.
[tool.setuptools.package-data]
mlipx = ["data/validation/*.json"]

[tool.ruff]
line-length = 88
target-version = "py310"
