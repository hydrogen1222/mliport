[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mliport"
version = "2.0.0b3"
description = "Backend-neutral CLI/TUI/Python workflows for MLIP models (MACE, DPA, GRACE, UMA)"
readme = "README.md"
license = { text = "MIT License" }
requires-python = ">=3.10, <3.13"
dependencies = [
    "ase>=3.26.0",
    "numpy",
    "packaging",
    "tqdm",
    # Textual 8.x is the verified baseline for the TUI; the upper bound keeps
    # untested major releases (v9+) out until they pass the TUI suite.
    "textual>=8.2.8,<9",
]

[project.optional-dependencies]
# NOTE: there is deliberately no `uma` extra. UMA is installed by the
# compatibility-matrix-driven installer (scripts/install_mliport.sh), which pins
# the fairchem-core version in mliport/install/compatibility.py. A PyPI extra
# would drift from the matrix and conflicts with fairchem-core's own Python
# requirement.
analysis = [
    "scipy>=1.11",
    "matplotlib>=3.7",
]
transport = [
    "kinisi>=2.0.5,<3",
]
electrolyte = [
    "gemdat>=1.7.3,<2",
]
analysis-all = [
    "scipy>=1.11",
    "matplotlib>=3.7",
    "kinisi>=2.0.5,<3",
    "gemdat>=1.7.3,<2",
]
dev = [
    "pytest",
    "pytest-asyncio",
    # exercised via ase.spacegroup.symmetrize (fix-symmetry contract tests)
    "spglib",
    "ruff",
    "mypy",
    # GitHub Actions workflow hygiene tests parse .github/workflows/*.yml
    "pyyaml",
]

[project.scripts]
mliport = "mliport.cli:main"

[project.urls]
repository = "https://github.com/hydrogen1222/mliport"
documentation = "https://github.com/hydrogen1222/mliport/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["."]
# Explicit include list: auto-discovery would pick up stale setuptools build
# caches (build/lib/**) and other repository artifacts as packages.
include = ["mliport", "mliport.*", "examples", "examples.*"]
namespaces = false


# Curated capability evidence must ship inside the wheel so an installed
# mliport can resolve capabilities without a repository checkout.
[tool.setuptools.package-data]
mliport = ["data/validation/*.json"]

[tool.ruff]
line-length = 88
target-version = "py310"
